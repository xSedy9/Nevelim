[package]
name = "quick-snippets-desktop"
description = "Quick Snippets desktop shell: Tauri v2 entry point, windows, hotkeys, IPC"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "quick-snippets-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quick-snippets-core = { path = "../backend" }
dirs = "6"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
